name: Testes

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@escola.com
      ADMIN_PASSWORD: admin123

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Iniciar API
        run: nohup npm start > server.log 2>&1 &

      - name: Aguardar API responder
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Executar testes com relatorio
        run: npm run test:report

      - name: Publicar relatorio Mochawesome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: mochawesome-report/
          if-no-files-found: ignore

      - name: Publicar log da API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore
